name: Publish predictions HTML

on:
  workflow_dispatch:
  schedule:
    # JST 06:10 = UTC 21:10（前日）
    - cron: "10 21 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build today report (JST)
        env:
          TZ: Asia/Tokyo
        run: |
          python - << 'PY'
          import datetime as dt
          from v2_0_0.src.report_html import build_html_report
          target_date = dt.datetime.now().strftime("%Y-%m-%d")
          out = build_html_report(target_date, topk_per_race=18)
          print("Saved:", out)
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2_0_0/data/predictions_html || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update predictions HTML"
            git push
          fi
