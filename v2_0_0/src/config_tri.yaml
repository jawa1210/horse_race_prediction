features:
- horse_id
- jockey_id
- trainer_id
- wakuban
- umaban
- sex
- age
- weight
- weight_diff
- impost
- agari
- race_type
- around_dir
- around_inout
- course_abc
- course_len
- weather
- ground_state
- race_class
- place
- rank_3races
- prize_3races
- rank_5races
- prize_5races
- rank_10races
- prize_10races
- rank_1000races
- prize_1000races
params:
  bagging_fraction: 0.8
  bagging_freq: 1
  feature_fraction: 0.8
  lambda_l1: 0.0
